name: Monorepo CI

on:
  push:
    branches:
      - main
      - 'launch/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Monorepo Validation & Typechecks
        run: npm run check
